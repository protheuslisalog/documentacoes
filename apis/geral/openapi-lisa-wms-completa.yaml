openapi: 3.0.3
info:
  title: API WMS Lisalog
  description: |
    APIs de integração com o WMS da **Lisa — Logística Integrada Sulamericana** (Protheus/TOTVS).

    - Envio, atualização e cancelamento de pedidos (`/PEDIDOWMS`)
    - Consulta de status de pedido (`/WMSSTATUS`) e de pedidos por data (`/RSSTSPG`)
    - Consulta de quantidade de pedidos por status (`/wms/v2/pedidosPorStatus/query`) e lista de pedidos (`/wms/v2/pedidoWms/query`)
    - Romaneio de saída (`/wms/v2/consultaRomaneioSaida`)
    - Notas de saída (`/NOTASAIDA`, `/WMSSF2`) e de entrada (`/NOTAENTRADA`, `/WMSSTSENT`)
    - Saldo em estoque (`/WMSESTOQUE`, `/RSESTPG`), documentos (`/DOCUMENTOS`) e transferências (`/TRANSFERENCIA`)

    Para o ambiente de produção, solicite à Lisalog o IP, porta, usuário e senha.
    Para as APIs de consulta, solicite chave, senha e código da filial ao coordenador do WMS.
  version: 1.0.0
servers:
  - url: '{host}/rest'
    description: Servidor da API (padrão = homologação)
    variables:
      host:
        default: https://li195956.protheus.cloudtotvs.com.br:11257
        description: Protocolo, host e porta do servidor
security:
  - basicAuth: []
tags:
  - name: Pedidos
    description: Envio, atualização e cancelamento de pedidos
  - name: Status
    description: Consultas de status de pedidos
  - name: Romaneio
    description: Consulta de romaneio de saída
  - name: Notas de saída
    description: Envio e consulta de notas fiscais de saída
  - name: Notas de entrada
    description: Envio, exclusão e status de notas fiscais de entrada
  - name: Estoque
    description: Saldo em estoque
  - name: Documentos
    description: Envio de documentos do pedido
  - name: Transferência
    description: Transferência entre armazéns
paths:
  /PEDIDOWMS:
    post:
      tags: [Pedidos]
      summary: Enviar pedido para separação
      description: Envia pedidos e suas informações para separação nos armazéns da Lisalog.
      operationId: enviarPedidoSeparacao
      requestBody:
        required: true
        content:
