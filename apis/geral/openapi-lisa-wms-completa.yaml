            schema:
              $ref: '#/components/schemas/SeparacaoPedido'
            example:
              ccodfilial: '01'
              ccgc: '71586952000157'
              cpedido: '1234'
              cenderecodestino: RUA COPPINI
              cbairrodestino: CENTRO
              ccidadedestino: SAO PAULO
              cestadodestino: SP
              ccomplementodestino: CASA 2
              cnomedestino: JOAO
              ccpfcnpjdestino: '35478258067'
              ccepdestino: '09341340'
              cnumerodestino: '79'
              ccontatodestino: JOAO
              cfonedestino: '5511996899999'
              stringxmlnfe: ''
              cnota: '1111'
              cserie: '1'
              ccgctransportadora: ''
              ccodigoservicocorreios: ''
              carmazem: ''
              curldanfe: ''
              ccampanha: ''
              nvalordeclarado: 0
              cdanfebase64: ''
              cetiquetabase64: ''
              campanhaObs: ''
              cboletobase64: ''
              ccartacorrecaobase64: ''
              cguiast64: ''
              ccomprovantepagamento64: ''
              cpedidomarketplace: ''
              cTransportadora: ''
              nquantidadevolumes: 1
              cemaildestino: ''
              nProtocolo: 12341251234
              cRastreio: ''
              cPlp: ''
              cNotaOriginal: ''
              cSerieOriginal: ''
              cCnpjFornecedor: ''
              aitens:
                - citempedido: '0001'
                  cproduto: 10650X
                  ccodbarras: ''
                  cdescricao: TELEFONE FIXO
                  nqtd: 1
                  nvalorunitario: 10.10
                  clote: ''
                  npesokg: 0
              volumes:
                - codigoVolume: X1
                  descricaoVolume: Descricao volume X1
                  codigoBarras: '1234'
                  embalagemDoProduto: false
                  altura: 1
                  peso: 1
                  largura: 1
                  comprimento: 1
                  produtos:
                    - produto: 10650X
                      quantidade: 1
                      altura: 1
                      largura: 1
                      comprimento: 1
      responses:
        '200':
          description: Requisição processada (o corpo da resposta não é descrito na documentação original)
        '401':
          description: Não autorizado — credenciais inválidas
    put:
      tags: [Pedidos]
      summary: Atualizar ou cancelar pedido
      description: |
        Atende duas operações no mesmo endpoint:

        - **Atualização** de dados do pedido (NF, DANFE, transportadora, rastreio etc.)
        - **Cancelamento** do pedido, enviando `cstatus = "C"`
      operationId: atualizarOuCancelarPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AtualizaPedido'
                - $ref: '#/components/schemas/CancelaPedido'
            examples:
              atualizaPedido:
                summary: Atualização de dados do pedido
                value:
                  ccodfilial: '07'
                  ccgc: '71586952000257'
                  cpedido: '1234'
                  cnota: '1111'
                  cserie: '1'
                  cdanfebase64: ''
                  nvalordeclarado: 0
                  stringxmlnfe: ''
                  ccgctransportadora: ''
                  curldanfe: ''
                  cboletobase64: ''
                  ccartacorrecaobase64: ''
                  curlguiaST: ''
                  ccomprovantepagamento64: ''
                  cetiquetabase64: ''
                  cRastreio: ''
                  ccampanha: ''
                  lalteraetiqueta: false
                  cPlp: ''
              cancelaPedido:
                summary: Cancelamento de pedido
                value:
                  ccodfilial: '07'
                  ccgc: '71586952000257'
                  cpedido: '1234'
                  cstatus: C
      responses:
        '200':
          description: Requisição processada (o corpo da resposta não é descrito na documentação original)
        '401':
          description: Não autorizado — credenciais inválidas
  /WMSSTATUS:
    get:
      tags: [Status]
      summary: Consultar status de um pedido
      operationId: consultarStatusPedido
      parameters:
        - $ref: '#/components/parameters/Chave'
        - $ref: '#/components/parameters/FilialLisa'
        - $ref: '#/components/parameters/SenhaConsulta'
        - $ref: '#/components/parameters/Cgc'
        - name: PEDIDO
          in: query
          required: true
          description: Código do pedido
          schema:
            type: string
            example: '19730380'
      responses:
        '200':
          description: Status do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPedidoResponse'
              example:
                ASTATUS:
                  - ASERIEMAI:
                      - CIMEISERIE: WSBC565425895
                        CPRODUTO: '123546'
                        CPRODCLIENTE: '123456'
                    AEMBALAGEM:
                      - CCODIGO: '000008'
                        CDESCRICAO: 10X10X10
                        NALTURA: 10
                        NCOMPRIMENTO: 10
                        NLARGURA: 10
                        NQUANTIDADE: 1
                    CCAMPANHA: ITASH
                    CPEDCLIENTE: '19730380'
                    CEMBALAGEM: '19730380'
                    CRASTREIO: ''
                    CROMANEIO: ''
                    DATAEXPEDIDO: '20220603'
                    DATAROMANEIO: '20220603'
                    HORAEXPEDIDO: '09:21'
                    LETIQUETAINTEGRADA: false
                    NCUBAGEM: 0
                    NPESOBRU: 0
                    NPESOLIQ: 0
                    NQTDCAIXA: 0
                    NQTDPALLET: 0
                    CPEDLISA: SYBVRJ
                    CSTATUS: FINALIZADO
                CCGC: '71586952000157'
                CCHAVE: '01719201'
                CFILIALWMS: '01'
                CPEDIDO: '19730380'
        '401':
          description: Não autorizado — credenciais inválidas
  /RSSTSPG:
    get:
      tags: [Status]
      summary: Consultar status dos pedidos de uma data
      description: Retorna 100 pedidos por página. Para datas com mais de 100 pedidos, use `PAGINA` para obter as demais páginas.
      operationId: consultarStatusPedidosPorData
      parameters:
        - $ref: '#/components/parameters/Chave'
        - $ref: '#/components/parameters/FilialLisa'
        - $ref: '#/components/parameters/SenhaConsulta'
        - $ref: '#/components/parameters/Cgc'
        - name: DATAPEDIDO
          in: query
          required: true
          description: Data para consulta do pedido, no formato `AAAAMMDD`
          schema:
            type: string
            pattern: '^\d{8}$'
            example: '20260101'
        - name: PAGINA
          in: query
          required: false
          description: Número da página
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Pedidos da data informada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPorDataResponse'
              example:
                CDATAPEDIDO: '20260101'
                LISTAPEDIDOS:
                  - ASTATUS:
                      - AEMBALAGEM: []
                        ASERIIMEI:
                          - CIMEISERIE: ''
                            CPRODCLIENTE: Y-YP1269
                            CPRODUTO: YBEY-YP1269
                        CCAMPANHA: LOJA INTERNA B2C
                        CEMBALAGEM: ''
                        CPEDCLIENTE: '3619731'
                        CPEDLISA: TBTRZ2
                        CRASTREIO: ''
                        CROMANEIO: '314776'
                        CSTATUS: FINALIZADO
                        CURLTRACKING: ''
                        DATAEXPEDIDO: '20260221'
                        DATAROMANEIO: '20260221'
                        HORAEXPEDIDO: '18:10'
                        ITENS:
                          - IDNOTAORIGEM: ''
                            ITEMNOTAORIGEM: ''
                            LOTE: AUTO130181
                            NOTA: 9AH3CM
                            NOTAORIGEM: ''
                            PRODUTO: Y-YP1269
                            QUANTIDADE: 1
                            SERIE: W
                            SERIEORIGEM: ''
                        LETIQUETAINTEGRADA: true
                        NCUBAGEM: 0
                        NOTACLIENTE: '2845857'
                        NPESOBRU: 1
                        NPESOLIQ: 1
                        NQTDCAIXA: 1
                        NQTDPALLET: 0
                    CCGC: '35689522000127'
                    CCHAVE: '86280601'
                    CFILIALWMS: '01'
                    CPEDIDO: '3619731'
                PAGCORRENTE: 1
                PAGTOTAL: 1
        '401':
          description: Não autorizado — credenciais inválidas
  /wms/v2/pedidosPorStatus/query:
    get:
      tags: [Status]
      summary: Consultar quantidade de pedidos por status
      description: |
        Retorna a quantidade de pedidos de um cliente agrupados por status.
        Sem `dataPedido`, apresenta a posição atual de todos os pedidos, independente da data.
      operationId: consultarPedidosPorStatus
      parameters:
        - name: tenantId
          in: header
          required: true
          description: 'Empresa e filial, no formato `empresa,filial` (ex.: `03,01`). Para a empresa, utilizar `03`; a filial é o código da filial Lisalog.'
          schema:
            type: string
            example: '03,01'
        - name: senha
          in: query
          required: true
          description: Senha de acesso ao endpoint
          schema:
            type: string
            example: XXXXXXXX
        - name: chave
          in: query
          required: true
          description: Chave de acesso ao endpoint
          schema:
            type: string
            example: XXXXXXXX
        - name: dataPedido
          in: query
          required: false
          description: Data de consulta no formato `AAAAMMDD`
          schema:
            type: string
            pattern: '^\d{8}$'
            example: '20260812'
      responses:
        '200':
          description: Quantidade de pedidos por status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidosPorStatusResponse'
              example:
                items:
                  - status: '1'
                    descricaoStatus: A SEPARAR
                    quantidade: 1
                  - status: '3'
                    descricaoStatus: A CONFERIR
                    quantidade: 172
                  - status: '4'
                    descricaoStatus: CONFERIDO
                    quantidade: 106
                  - status: '5'
                    descricaoStatus: A EXPEDIR
                    quantidade: 2433
                  - status: '6'
                    descricaoStatus: FINALIZADO
                    quantidade: 561366
                  - status: '7'
                    descricaoStatus: CANCELADO
                    quantidade: 199
                cliente: XXXXXX
                loja: XX
                dataPedido: ''
        '401':
          description: Não autorizado — credenciais inválidas
  /wms/v2/pedidoWms/query:
    get:
      tags: [Status]
      summary: Consultar lista de pedidos WMS
      description: |
        Lista paginada com detalhes dos pedidos (número do pedido cliente, pedido, nota, status, campanha,
        transportadora, datas de integração, pedido, romaneio e finalização).
        Filtros opcionais por período (`dataDe`/`dataAte`), `status` e `pedido`.
      operationId: consultarPedidosWms
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ChaveV2'
        - $ref: '#/components/parameters/SenhaV2'
        - name: dataDe
          in: query
          required: false
          description: 'Data inicial no formato AAAAMMDD, para busca por período.'
          schema:
            type: string
            pattern: '^\d{8}$'
            example: '20260801'
        - name: dataAte
          in: query
          required: false
          description: 'Data final no formato AAAAMMDD, para busca por período.'
          schema:
            type: string
            pattern: '^\d{8}$'
            example: '20260821'
        - name: status
          in: query
          required: false
          description: 'Código do status para filtro (1 A SEPARAR, 3 A CONFERIR, 4 CONFERIDO, 5 A EXPEDIR, 6 FINALIZADO, 7 CANCELADO). Em branco, não filtra.'
          schema:
            type: string
            example: '1'
        - name: pedido
          in: query
          required: false
          description: 'Número do pedido, para retornar apenas um pedido específico.'
          schema:
            type: string
            example: '3254698'
        - name: page
          in: query
          required: true
          description: 'Número da página.'
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: pageSize
          in: query
          required: true
          description: 'Quantidade de registros por página (máximo de 3000).'
          schema:
            type: integer
            minimum: 1
            maximum: 3000
            example: 1000
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoWmsResponse'
              example:
                items:
                  - pedidoCliente: 4074405V3
                    pedido: U06538
                    nota: ''
                    status: '1'
                    campanha: XPTO
                    transportadora: LOGISTICA LTDA.
                    cnpjTransportadora: ''
                    dataHoraIntegracao: ''
                    dataHoraPedido: '20260804 11:17'
                    dataRomaneio: ''
                    dataHoraFinalizado: ''
                hasNext: true
        '401':
          description: Não autorizado — credenciais inválidas
  /wms/v2/consultaRomaneioSaida/query:
    get:
      tags: [Romaneio]
      summary: Consultar romaneio de saída (query)
      description: |
        Recupera o romaneio de saída em base64 junto com os dados do romaneio e do pedido.

        **Formas de consulta**

        - Por número do romaneio: preencha `codigoRomaneio` e deixe vazios `pedidoCliente`, `dataInicial` e `dataFinal`.
        - Por pedido cliente: preencha `pedidoCliente` e deixe vazios `codigoRomaneio`, `dataInicial` e `dataFinal`.
        - Por período: preencha `dataInicial` e `dataFinal` e deixe vazios `pedidoCliente` e `codigoRomaneio`.

        Limite de 30 dias por consulta de período. Consultas por período e automatizadas devem rodar fora do horário
        de funcionamento dos armazéns (sugestão: 00:00 às 05:00). Cada página retorna 1 romaneio.

        O documento original descreve também uma consulta com os mesmos campos em corpo JSON no caminho
        `/wms/v2/consultaRomaneioSaida` (GET com body), não representada aqui.
      operationId: consultarRomaneioSaidaQuery
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: cnpj
          in: query
          required: true
          description: 'CNPJ da empresa.'
          schema:
            type: string
            example: '68993641000802'
        - name: chave
          in: query
          required: true
          description: 'Código identificador do cliente na Lisa.'
          schema:
            type: string
            example: '86234601'
        - name: tipoRomaneio
          in: query
          required: true
          description: 'Tipo do romaneio. Valor padrão 2; outro valor retorna erro 400.'
          schema:
            type: string
            default: '2'
            example: '2'
        - name: codigoRomaneio
          in: query
          required: false
          description: 'Número do romaneio na Lisalog (consulta por romaneio).'
          schema:
            type: string
            example: '075559'
        - name: pedidoCliente
          in: query
          required: false
          description: 'Código do pedido cliente (consulta por pedido).'
          schema:
            type: string
            example: '4105765'
        - name: dataInicial
          in: query
          required: false
          description: 'Data inicial do romaneio, AAAAMMDD (consulta por período).'
          schema:
            type: string
            pattern: '^\d{8}$'
            example: '20250909'
        - name: dataFinal
          in: query
          required: false
          description: 'Data final do romaneio, AAAAMMDD (consulta por período, limite de 30 dias).'
          schema:
            type: string
            pattern: '^\d{8}$'
            example: '20250909'
        - name: pageSize
          in: query
          required: true
          description: 'Tamanho da página. Padrão 1 (a consulta retorna sempre 1 romaneio por página).'
          schema:
            type: string
            default: '1'
            example: '1'
        - name: page
          in: query
          required: true
          description: 'Número da página. Sempre 1 nas consultas por romaneio e por pedido; na consulta por período, informe a página desejada (veja totalPagina e hasNext).'
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Romaneio de saída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RomaneioSaidaResponse'
              example:
                items:
                  - codFilial: '09'
                    codCliente: '86234601'
                    Cliente: AGIS
                    dataInclusao: 09/09/2025
                    horaInclusao: '07:57'
                    dataFim: 09/09/2025
                    horaFim: '07:57'
                    expedido: S
                    tipo: '2'
                    numeroRomaneio: '075559'
                    cnpjTransportador: '09498335000660'
                    transportadora: CNLOG
                    motorista: ''
                    rg: ''
                    tipoVeiculo: '4'
                    veiculo: ''
                    romaneioBase64: JVBERi0xLjMKJbe+raoK...
                    PedidoNotaFiscal:
                      - fornecedor: ''
                        importacao: ''
                        nota: '0538164'
                        serie: ''
                        pedidoLisa: '671374'
                        pedidoCliente: 4063943cancel
                        qtdCaixas: '2'
                        qtdPallets: '0'
                        obsRomaneio: ''
                        lacre: ''
                numeroPagina: '1'
                totalPagina: 64
                hasNext: true
        '400':
          description: Erro de validação dos parâmetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RomaneioErro'
              examples:
                cnpjVazio:
                  summary: cnpj nulo ou vazio
                  value:
                    code: '400'
                    message: 'Erro cCNPJ '
                    detailedMessage: 'cCNPJ: campo vazio'
                paginaInvalida:
                  summary: page maior que totalPagina
                  value:
                    code: '400'
                    message: 'Erro numero página'
                    detailedMessage: 'Número da página solicitada é maior que a quantidade de romaneios disponíveis - 64'
        '401':
          description: Não autorizado — credenciais inválidas
  /NOTASAIDA:
    post:
      tags: [Notas de saída]
      summary: Enviar nota de saída
      description: 'Envia a nota fiscal de saída de um pedido. No fluxo de expedição, é enviada após o pedido atingir o status CONFERIDO (ou a qualquer momento, quando a quantidade de volumes não é necessária).'
      operationId: enviarNotaSaida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaSaidaEnvio'
            example:
              ccodFilial: '01'
              cNumeroPedido: '1234'
              cNumeroNota: '5566'
              cSerieNota: '001'
              cDataNota: '20190827'
              cCNPJEmitente: '71586952000157'
              cCNPJCPFDestinatario: '71586952000157'
              cChaveNfe: '32190811838642000180550050000005511000047886'
              cDanfeBase64: ''
              nvalornota: 10.0
              cCNPJtransportadora: ''
              cTransportadora: ''
              cxml: ''
              cRastreio: ''
              curldanfe: ''
              curlboleto: ''
              curlguiaST: ''
              ccomprovantepagamento64: ''
              cetiquetabase64: ''
              cARcorreiosbase64: ''
              clistapostagembase64: ''
              cgnrebase64: ''
      responses:
        '200':
          description: Requisição processada (o corpo da resposta não é descrito na documentação original)
        '401':
          description: Não autorizado — credenciais inválidas
  /WMSSF2:
    get:
      tags: [Notas de saída]
      summary: Consultar dados da nota de saída
      description: 'Retorna os itens de uma nota de saída. Os campos D2_* não são descritos na documentação original.'
      operationId: consultarNotaSaida
      parameters:
        - $ref: '#/components/parameters/Chave'
        - $ref: '#/components/parameters/FilialLisa'
        - $ref: '#/components/parameters/SenhaConsulta'
        - $ref: '#/components/parameters/Cgc'
        - name: NOTA
          in: query
          required: true
          description: 'Número da nota fiscal.'
          schema:
            type: string
            example: '123456'
        - name: SERIE
          in: query
          required: true
          description: 'Série da nota fiscal.'
          schema:
            type: string
            example: '2'
      responses:
        '200':
          description: Dados da nota de saída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaSaidaConsultaResponse'
              example:
                CCGC: '71586952000157'
                CCHAVE: '00000101'
                CFILIALWMS: '08'
                CNOTA: '123456'
                CSERIE: '2'
                NPROTOCOLO: 1234234
                ITENS:
                  - D2_COD: '28111015097'
                    D2_ITEM: '01'
                    D2_ITEMORI: '0016'
                    D2_LOTECTL: ''
                    D2_NFORI: '000069636'
                    D2_PRCVEN: 2.945
                    D2_QUANT: 645
                    D2_SERIORI: '2'
                    D2_TOTAL: 1899.52
                    D2_UM: MT
        '401':
          description: Não autorizado — credenciais inválidas
  /NOTAENTRADA:
    post:
      tags: [Notas de entrada]
      summary: Enviar nota de entrada
      description: 'Envia uma nota fiscal de entrada para recebimento. Todos os campos devem ser enviados; sem informação, envie em branco (texto) ou zero (numérico).'
      operationId: enviarNotaEntrada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaEntrada'
            example:
              ccodfilial: '01'
              cnota: '000123'
              cserie: '1'
              cemissaonf: '20180814'
              ccgcfornecedor: '15276578000142'
              ccgc: '71586952000157'
