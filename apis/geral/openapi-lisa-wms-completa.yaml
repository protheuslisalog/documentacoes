  /WMSSTSENT:
    get:
      tags: [Notas de entrada]
      summary: Consultar status da nota de entrada
      description: 'Status de recebimento e endereçamento de uma nota de entrada, com os armazéns e endereços onde os produtos foram alocados.'
      operationId: consultarStatusNotaEntrada
      parameters:
        - $ref: '#/components/parameters/Chave'
        - $ref: '#/components/parameters/FilialLisa'
        - $ref: '#/components/parameters/SenhaConsulta'
        - $ref: '#/components/parameters/Cgc'
        - name: NOTA
          in: query
          required: true
          description: 'Número da nota fiscal.'
          schema:
            type: string
            example: '001114828'
        - name: CGCFORNECEDOR
          in: query
          required: true
          description: 'CNPJ do fornecedor.'
          schema:
            type: string
            example: '71586952000257'
        - name: SERIE
          in: query
          required: true
          description: 'Série da nota fiscal.'
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Status da nota de entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEntradaResponse'
              example:
                AITENS:
                  - ARMAZEM: '06'
                    ENDERECAMENTO:
                      - ENDERECO: B091
                        QUANTIDADE: 300
                    PRODUTO: YC110PRE-M
                    PRODUTOLISA: YC110PRE-M
                    QUANTIDADE: 300
                ASTATUS:
                  - CCLIENTE: TESTE
                    CNOTA: '001114828'
                    CSERIE: '1'
                    CSTATUS: NAO INTEGRADA
                CCGC: '71586952000257'
                CCGCFORNECEDOR: '71586952000257'
                CCHAVE: '12345678'
                CFILIALWMS: '01'
                CNOTAFISCAL: '001114828'
                CSERIEFISCAL: '1'
        '401':
          description: Não autorizado — credenciais inválidas
  /WMSESTOQUE:
    get:
      tags: [Estoque]
      summary: Consultar saldo em estoque de um produto
      operationId: consultarEstoqueProduto
      parameters:
        - $ref: '#/components/parameters/Chave'
        - $ref: '#/components/parameters/FilialLisa'
        - $ref: '#/components/parameters/SenhaConsulta'
        - $ref: '#/components/parameters/Cgc'
        - name: PRODUTO
          in: query
          required: true
          description: 'Código do produto.'
          schema:
            type: string
            example: BY3328
      responses:
        '200':
          description: Saldo do produto por armazém e lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoqueProdutoResponse'
              example:
                AESTOQUE:
                  - ALOTES:
                      - CARMAZEM: '91'
                        CLOTE: AUTO033996
                        CVALIDADE: ''
                        NQTDCLASS: 0
                        NQTDINTEGRA: 0
                        NQTDPEDIDO: 0
                        NSALDO: 5
                    CARMAZEM: '91'
                    CCODCLIENTE: BY3328
                    CCODFILIAL: '07'
                    CCODLISA: CLACBY3328
                    NQTDCLASS: 0
                    NQTDINTEGRA: 0
                    NQTDNAOCLASS: 0
                    NQTDPEDIDO: 0
                    NSALDO: 5
                CCGC: '71586952000157'
                CCHAVE: '00028801'
                CFILIALWMS: '01'
                CPRODUTO: BY3328
        '401':
          description: Não autorizado — credenciais inválidas
  /RSESTPG:
    get:
      tags: [Estoque]
      summary: Consultar saldo em estoque por páginas
      description: 'Consulta vários produtos em uma única chamada, de forma paginada. O documento original não informa se PAGINA é obrigatório nem se aceita o filtro PRODUTO.'
      operationId: consultarEstoquePaginado
      parameters:
        - $ref: '#/components/parameters/Chave'
        - $ref: '#/components/parameters/FilialLisa'
        - $ref: '#/components/parameters/SenhaConsulta'
        - $ref: '#/components/parameters/Cgc'
        - name: PAGINA
          in: query
          required: false
          description: 'Número da página.'
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Página de produtos com saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoquePaginadoResponse'
