          description: Código do produto na Lisa
        NQTDCLASS:
          type: number
          description: Quantidade não endereçada
        NQTDINTEGRA:
          type: number
          description: Quantidade integrada aguardando processamento
        NQTDNAOCLASS:
          type: number
          description: Quantidade não classificada
        NQTDPEDIDO:
          type: number
          description: Quantidade em pedido de venda para separação
        NSALDO:
          type: number
          description: Saldo disponível do produto
    EstoqueProdutoResponse:
      type: object
      properties:
        AESTOQUE:
          type: array
          description: Saldo por armazém
          items:
            $ref: '#/components/schemas/EstoqueArmazem'
        CCGC:
          type: string
          description: CNPJ da requisição
        CCHAVE:
          type: string
          description: Chave de acesso utilizada
        CFILIALWMS:
          type: string
          description: Filial do saldo
        CPRODUTO:
          type: string
          description: Código do produto
    EstoquePaginadoResponse:
      type: object
      properties:
        LISTAPRODUTOS:
          type: array
          description: Lista dos produtos retornados na consulta
          items:
            $ref: '#/components/schemas/EstoqueProdutoResponse'
        PAGCORRENTE:
          type: integer
          description: Página corrente da consulta
        PAGTOTAL:
          type: integer
          description: Quantidade total de páginas disponíveis
    DocumentoEnvio:
      type: object
      required: [ccodFilial, cpedido, ccgc, ctipo]
      properties:
        ccodFilial:
          type: string
          description: Filial Lisa onde foi enviado o pedido para separação
        cpedido:
          type: string
          description: Número do pedido
        ccgc:
          type: string
          description: CNPJ do cliente
        ctipo:
          type: string
          description: 'Tipo do documento (ex.: Boleto, GNRE, Guia ST, Carta de correção ou Outros; o exemplo usa etiqueta)'
        cdocumentoPDFbase64:
          type: string
          description: Documento PDF codificado em base64
        curldocumentoPDF:
          type: string
          description: URL para download do documento em PDF
        cEtiquetaZPL:
          type: string
          description: Etiqueta de transporte em base64, formato TXT padrão Zebra
    TransferenciaEnvio:
      type: object
      required: [ccodfilial, cCNPJ, cNumeroDocumento, cArmazemOrigem, cArmazemDestino, nQuantidade, cProduto]
      properties:
        ccodfilial:
          type: string
          description: Código da filial da Lisalog
        cCNPJ:
          type: string
          description: CNPJ do cliente (integrador) Lisalog
        cNumeroDocumento:
          type: string
          description: Número do documento; pode ser sequencial ou qualquer número controlado pelo integrador
        cArmazemOrigem:
          type: string
          description: Código do armazém de origem
        cArmazemDestino:
          type: string
          description: Código do armazém de destino
        nQuantidade:
          type: number
          description: Quantidade a ser transferida
        cProduto:
          type: string
          description: Código do produto
        cLote:
          type: string
          description: Código do lote
    TransferenciaItem:
      type: object
      properties:
        CARMAZEMDESTINO:
          type: string
        CARMAZEMORIGEM:
          type: string
        CCNPJ:
          type: string
        CCODFILIAL:
          type: string
        CDATA:
          type: string
          description: Data da transferência (AAAAMMDD)
        CLOTE:
          type: string
        CNUMERODOCUMENTO:
          type: string
        CPRODUTO:
          type: string
        NQUANTIDADE:
          type: number
        STATUS:
          type: string
          description: Status da transferência (o exemplo traz P; sem legenda no documento original)
    TransferenciasResponse:
      type: object
      properties:
        PAGINA:
          type: string
          description: Página consultada
        TOTALPAGINAS:
          type: integer
          description: Total de páginas
        TRANFERENCIAS:
          type: array
          description: Transferências encontradas (a chave vem grafada TRANFERENCIAS, sem o segundo S)
          items:
            $ref: '#/components/schemas/TransferenciaItem'
