<svg xmlns="http://www.w3.org/2000/svg" width="460" height="550" viewBox="0 0 460 550" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>Fluxo de entrada (recebimento)</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="460" height="550" fill="#ffffff"/>

  <g stroke="#4a5568" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <line x1="230" y1="60" x2="230" y2="88"/>
    <line x1="230" y1="146" x2="230" y2="178"/>
    <line x1="230" y1="236" x2="230" y2="258"/>
    <polyline points="320,310 400,310 400,208 342,208"/>
    <line x1="230" y1="360" x2="230" y2="398"/>
    <line x1="230" y1="456" x2="230" y2="488"/>
  </g>

  <g fill="#ebf4ff" stroke="#3182ce" stroke-width="1.6">
    <rect x="170" y="20" width="120" height="40" rx="20"/>
    <rect x="120" y="90" width="220" height="56" rx="6"/>
    <rect x="120" y="180" width="220" height="56" rx="6"/>
    <polygon points="230,260 320,310 230,360 140,310" fill="#fffaf0" stroke="#dd6b20"/>
    <rect x="120" y="400" width="220" height="56" rx="6" fill="#f0fff4" stroke="#38a169"/>
    <rect x="170" y="490" width="120" height="40" rx="20"/>
  </g>

  <g fill="#1a202c" text-anchor="middle">
    <text x="230" y="45">Início</text>
    <text x="230" y="114" font-weight="600" font-family="Consolas, Menlo, monospace">POST /NOTAENTRADA</text>
    <text x="230" y="134">Envia nota de entrada</text>
    <text x="230" y="204" font-weight="600" font-family="Consolas, Menlo, monospace">GET /WMSSTSENT</text>
    <text x="230" y="224">Consulta status da entrada</text>
    <text x="230" y="305" font-size="13">Status</text>
    <text x="230" y="323" font-size="13" font-weight="600">FINALIZADO?</text>
    <text x="230" y="433">Saldo disponível para pedidos</text>
    <text x="230" y="515">Fim</text>
  </g>

  <g fill="#4a5568" font-size="13">
    <text x="352" y="302">Não</text>
    <text x="240" y="384">Sim</text>
  </g>
</svg>
