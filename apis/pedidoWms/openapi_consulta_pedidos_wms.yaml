openapi: 3.0.3
info:
  title: API Consulta de Pedidos WMS
  version: 1.0.0
  description: |
    Consulta detalhes de pedidos registrados no sistema.
servers:
  - url: https://servidor-exemplo
    description: Homologação.
tags:
  - name: Pedidos
    description: Consulta de pedidos WMS
paths:
  /rest/wms/v2/pedidoWms/query:
    get:
      tags: [Pedidos]
      summary: Consultar pedidos WMS
      operationId: consultarPedidosWms
      description: Datas no formato AAAAMMDD tamanho máximo de página documentado 3000.
      security:
        - basicAuth: []
      parameters:
        - name: tenantId
          in: header
          required: true
          description: Contexto da empresa e filial, no formato "empresa, filial".
          schema:
            type: string
          example: "03, 01"
        - name: x-id-cliente
          in: header
          required: true
          description: Chave de acesso do cliente.
          schema:
            type: string
          example: "9iojsdafkJHJS89jnNISijde4r490c"
        - name: senha
          in: query
          required: true
          description: Senha utilizada na requisição.
          schema: { type: string }
          example: "********"
        - name: chave
          in: query
          required: true
          description: Chave utilizada na requisição.
          schema: { type: string }
          example: "********"
        - name: dataDe
          in: query
          required: false
          description: Data inicial do período, formato AAAAMMDD.
          schema:
            type: string
            pattern: '^\\d{8}$'
          example: "20260801"
        - name: dataAte
          in: query
          required: false
          description: Data final do período, formato AAAAMMDD.
          schema:
            type: string
            pattern: '^\\d{8}$'
          example: "20260821"
        - name: status
          in: query
          required: false
          description: Código do status do pedido.
          schema:
            type: string
            enum: ["1", "3", "4", "5", "6", "7"]
          example: "1"
        - name: pedido
          in: query
          required: false
          description: Número do pedido específico.
          schema: { type: string }
          example: "3254698"
        - name: page
          in: query
          required: true
          description: Número da página.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: pageSize
          in: query
          required: true
          description: Quantidade de registros por página; máximo documentado 3000.
          schema:
            type: integer
            minimum: 1
            maximum: 3000
          example: 1000
      responses:
        "200":
          description: Consulta realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaConsultaPedidos"
              example:
                items:
                  - pedidoCliente: "4074405V3"
                    pedido: "U06538"
                    nota: ""
                    status: "1"
                    campanha: "TESTE.COM"
                    transportadora: "LOGISTICA LTDA."
                    cnpjTransportadora: ""
                    dataHoraIntegracao: ""
                    dataHoraPedido: "20260804 11:17"
                    dataRomaneio: ""
                    dataHoraFinalizado: ""
                hasNext: true
        "400":
          description: Requisição inválida.
        "401":
          description: Falha de autenticação.
        "500":
          description: Erro interno.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Credenciais Basic do ambiente.
  schemas:
    RespostaConsultaPedidos:
      type: object
      required: [items, hasNext]
      properties:
        items:
          type: array
          description: Lista de pedidos retornados.
          items:
            $ref: "#/components/schemas/PedidoWms"
        hasNext:
          type: boolean
          description: Indica se existem mais páginas/registros.
          example: true
    PedidoWms:
      type: object
      required: [pedidoCliente, pedido, status, dataHoraPedido]
      properties:
        pedidoCliente:
          type: string
          description: Identificador do pedido informado pelo cliente.
          example: "4074405V3"
        pedido:
          type: string
          description: Número do pedido no sistema.
          example: "U06538"
        nota:
          type: string
          description: Número da nota fiscal; pode vir vazio.
          example: ""
        status:
          type: string
          description: Status atual do pedido.
          enum: ["1", "3", "4", "5", "6", "7"]
          example: "1"
        campanha:
          type: string
          description: Campanha associada ao pedido.
          example: "TESTE.COM"
        transportadora:
          type: string
          description: Nome da transportadora.
          example: "LOGISTICA LTDA."
        cnpjTransportadora:
          type: string
          description: CNPJ da transportadora.
          example: ""
        dataHoraIntegracao:
          type: string
          description: Data e hora da integração.
          example: ""
        dataHoraPedido:
          type: string
          description: Data e hora do pedido, formato YYYYMMDD HH:mm.
          example: "20260804 11:17"
        dataRomaneio:
          type: string
          description: Data de geração do romaneio; pode vir vazia.
          example: ""
        dataHoraFinalizado:
          type: string
          description: Data e hora de finalização; pode vir vazia.
          example: ""