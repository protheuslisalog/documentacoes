openapi: 3.0.3
info:
  title: API Pedidos por Status
  description: |
    Permite consultar a quantidade de pedidos de um cliente, agrupados por status,
    considerando uma determinada data de pedido.

    **Lisa — Logística Integrada Sulamericana**
  version: 2.0.0
servers:
  - url: '{host}/rest/wms/v2'
    description: Servidor da API
    variables:
      host:
        default: https://seu-servidor.exemplo.com.br
        description: Endereço host do servidor
tags:
  - name: Pedidos por Status
    description: Consulta de pedidos agrupados por status
security:
  - basicAuth: []
    tenantId: []
paths:
  /pedidosPorStatus/query:
    get:
      tags:
        - Pedidos por Status
      summary: Consulta de pedidos por status
      description: |
        Retorna a quantidade de pedidos de um cliente agrupados por status.
        Caso `dataPedido` não seja informado, será apresentada a posição atual
        de todos os pedidos, independente da data.
      operationId: getPedidosPorStatus
      parameters:
        - name: tenantId
          in: header
          required: true
          description: 'Código da empresa e da filial, no formato `empresa,filial` (ex.: `03,01`). Para a empresa, utilizar `03`; a filial é o código da filial Lisalog.'
          schema:
            type: string
            example: '03,01'
        - name: x-id-cliente
          in: header
          required: true
          description: Chave de acesso do cliente.
          schema:
            type: string
          example: "9iojsdafkJHJS89jnNISijde4r490c"
        - name: senha
          in: query
          required: true
          description: Senha de acesso ao endpoint
          schema:
            type: string
            example: XXXXXXXX
        - name: chave
          in: query
          required: true
          description: Chave de acesso ao endpoint
          schema:
            type: string
            example: XXXXXXXX
        - name: dataPedido
          in: query
          required: false
          description: Data utilizada para consulta dos pedidos, no formato `AAAAMMDD`.
          schema:
            type: string
            pattern: '^\d{8}$'
            example: '20260812'
      responses:
        '200':
          description: Lista de status e respectivas quantidades de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidosPorStatusResponse'
              example:
                items:
                  - status: '1'
                    descricaoStatus: A SEPARAR
                    quantidade: 1
                  - status: '3'
                    descricaoStatus: A CONFERIR
                    quantidade: 172
                  - status: '4'
                    descricaoStatus: CONFERIDO
                    quantidade: 106
                  - status: '5'
                    descricaoStatus: A EXPEDIR
                    quantidade: 2433
                  - status: '6'
                    descricaoStatus: FINALIZADO
                    quantidade: 561366
                  - status: '7'
                    descricaoStatus: CANCELADO
                    quantidade: 199
                cliente: XXXXXX
                loja: XX
                dataPedido: ''
        '401':
          description: Não autorizado — credenciais de autenticação inválidas
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Authorization: Basic {{senhaAutenticacao}}'
    tenantId:
      type: apiKey
      in: header
      name: tenantId
      description: 'Empresa e filial: `{{empresa}},{{filial}}`'
  schemas:
    PedidosPorStatusResponse:
      type: object
      properties:
        items:
          type: array
          description: Lista dos status encontrados na consulta
          items:
            $ref: '#/components/schemas/StatusItem'
        cliente:
          type: string
          description: Código do cliente
          example: XXXXXX
        loja:
          type: string
          description: Código da loja do cliente
          example: XX
        dataPedido:
          type: string
          description: Data do pedido retornada pela API
          example: ''
    StatusItem:
      type: object
      properties:
        status:
          type: string
          description: |
            Código do status do pedido. Valores observados no exemplo:
            `1` A SEPARAR, `3` A CONFERIR, `4` CONFERIDO, `5` A EXPEDIR,
            `6` FINALIZADO, `7` CANCELADO.
          example: '3'
        descricaoStatus:
          type: string
          description: Descrição do status
          example: A CONFERIR
        quantidade:
          type: integer
          description: Quantidade de pedidos naquele status
          example: 172